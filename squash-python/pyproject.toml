[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squash-protocol"
version = "0.1.0"
description = "Hybrid JSON Compact Protocol — schema-aware transport optimization for JSON payloads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Ashwin", email = "ashwin.s.ashok@gmail.com" },
]
dependencies = [
    "pydantic>=2.0",
    "orjson>=3.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["squash"]
