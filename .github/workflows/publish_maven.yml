name: Publish SQUASH to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch: # Allow manual triggers

jobs:
  publish-kotlin:
    name: Publish to Maven Central
    runs-on: macos-latest # macOS is required to build iOS targets
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build and Publish Locally
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          ./gradlew publishAllPublicationsToLocalRepoRepository
          
      - name: Upload to Maven Central Portal
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          chmod +x .github/scripts/publish_maven_central.sh
          ./.github/scripts/publish_maven_central.sh
